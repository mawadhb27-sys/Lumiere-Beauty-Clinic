<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière — Service Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lato:wght@300;400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="details-page">
  <header class="details-header">
    <a href="index.html" class="details-logo"><img src="images/logo-header.png" alt="Lumière Beauty Clinic"></a>
    <div class="details-actions">
      <button id="details-lang" class="lang-btn">عربي</button>
      <a href="index.html#contact" class="book-btn" id="details-book">Book a Consultation</a>
    </div>
  </header>
  <main id="service-detail"></main>
  <script>
    const services = {
      1:{en:{title:'Advanced Facial Treatments',intro:'Medical-grade facial care designed around your skin rather than a fixed protocol.',body:'Your treatment begins with a detailed skin assessment. We then combine clinically supported techniques such as chemical peels, microneedling with PRP, and oxygen infusion according to your skin condition, sensitivity, and goals.',points:['Comprehensive skin analysis before treatment','Personalized combination of medical-grade techniques','Aftercare guidance tailored to your routine','Progress reviewed at every visit']},ar:{title:'علاجات الوجه المتقدمة',intro:'عناية طبية متقدمة مصممة لبشرتك، وليست بروتوكولاً ثابتاً للجميع.',body:'تبدأ الجلسة بتحليل شامل للبشرة، ثم نختار مجموعة من التقنيات المدعومة سريرياً مثل التقشير الكيميائي والإبر الدقيقة مع البلازما وعلاجات الأكسجين بما يناسب حالة بشرتك وأهدافك.',points:['تحليل شامل للبشرة قبل العلاج','اختيار تقنيات مخصصة حسب احتياجاتك','إرشادات واضحة للعناية بعد الجلسة','متابعة تطور البشرة في الزيارات اللاحقة']}},
      2:{en:{title:'Laser & Light Therapy',intro:'Targeted light and laser treatments for texture, pigmentation, redness, and overall skin clarity.',body:'Our laser protocols are selected after assessing your skin tone and concern. Treatments may include IPL photofacials, fractional resurfacing, or vascular-targeted work, always with a conservative approach focused on natural-looking improvement.',points:['Individual laser assessment','Treatment settings adapted to your skin','Focus on gradual, refined results','Detailed post-treatment care']},ar:{title:'علاج الليزر والضوء',intro:'تقنيات ضوئية وليزرية موجهة لتحسين التصبغات والملمس والاحمرار ونضارة البشرة.',body:'يتم اختيار التقنية المناسبة بعد تقييم لون البشرة والمشكلة الأساسية. قد تشمل الخطة جلسات IPL أو تجديداً سطحياً بالليزر أو علاجاً موجهاً للأوعية الدموية، مع التركيز دائماً على نتائج طبيعية ومتدرجة.',points:['تقييم دقيق قبل اختيار الجهاز','إعدادات مخصصة للون البشرة وحالتها','نتائج متدرجة وطبيعية','تعليمات واضحة للعناية بعد الجلسة']}},
      3:{en:{title:'Injectable Aesthetics',intro:'Refined, practitioner-led injectables designed to preserve your expression and individuality.',body:'Our practitioners take a conservative approach to injectables. Every plan starts with an assessment of facial balance, movement, and proportions before selecting the appropriate technique and product.',points:['Facial assessment and treatment planning','Conservative, natural-looking approach','Performed by qualified practitioners','Follow-up guidance after treatment']},ar:{title:'حقن التجميل',intro:'حقن تجميلية دقيقة بإشراف متخصصين للحفاظ على ملامحك الطبيعية وتوازن الوجه.',body:'نتبع نهجاً محافظاً في الحقن التجميلية. تبدأ كل خطة بتقييم تناسق الوجه وحركته ونسبه، ثم اختيار التقنية والمنتج المناسبين لتحقيق نتيجة متوازنة وغير مبالغ فيها.',points:['تقييم ملامح الوجه قبل العلاج','نتائج طبيعية ومتناسقة','تنفيذ على يد مختصين مؤهلين','إرشادات ومتابعة بعد الجلسة']}},
      4:{en:{title:'Body Contouring',intro:'Non-surgical contouring protocols combining advanced energy-based technologies.',body:'Body contouring at Lumière is designed around measurable goals. Depending on your needs, we may combine radiofrequency, HIFU, and cryolipolysis-based approaches to support contour refinement and skin tightening.',points:['Individual body assessment','Technology selected around your goals','Non-surgical treatment plans','Progress tracked over time']},ar:{title:'نحت الجسم',intro:'خطط غير جراحية لنحت القوام باستخدام تقنيات متقدمة تعتمد على الطاقة.',body:'نركز في نحت الجسم على أهداف واضحة وقابلة للمتابعة. وبحسب احتياجاتك، يمكن الجمع بين الترددات الراديوية وHIFU وتقنيات التبريد للمساعدة على تحسين التناسق وشد البشرة.',points:['تقييم مخصص لمنطقة العلاج','اختيار التقنية بحسب الهدف','خطط علاج غير جراحية','متابعة التقدم مع الوقت']}},
      5:{en:{title:'Brow & Eye Artistry',intro:'Precise brow and lash treatments that frame the eyes while keeping the result elegant.',body:'From microblading and brow lamination to lash lifts and tinting, every service is mapped to your natural features. The aim is definition without losing softness.',points:['Shape designed around your features','Natural-looking definition','Detailed symmetry check','Simple aftercare instructions']},ar:{title:'فن الحواجب والعيون',intro:'خدمات دقيقة للحواجب والرموش لإبراز العينين مع الحفاظ على مظهر أنيق وطبيعي.',body:'من الميكروبليدينج ولاميشن الحواجب إلى رفع الرموش وصبغها، يتم تصميم الخدمة بما يناسب ملامحك الطبيعية. الهدف هو إبراز العينين دون فقدان نعومتهما.',points:['تحديد الشكل وفق ملامحك','نتيجة طبيعية وأنيقة','مراجعة دقيقة للتناسق','تعليمات بسيطة للعناية']}},
      6:{en:{title:'Holistic Wellness Rituals',intro:'Restorative treatments that help you slow down while supporting circulation and relaxation.',body:'Our wellness rituals combine techniques such as lymphatic drainage, gua sha, and deep-tissue massage in a calm setting. Each session is adapted to how your body feels that day.',points:['Personalized wellness consultation','Combination of restorative techniques','Calming, private environment','Guidance for maintaining the benefits']},ar:{title:'طقوس العافية الشاملة',intro:'جلسات استرخاء واستعادة توازن تجمع بين العناية بالجسم والراحة العميقة.',body:'تجمع طقوس العافية لدينا بين التصريف اللمفاوي والغوا شا والتدليك العميق ضمن أجواء هادئة. ويتم تعديل الجلسة بحسب احتياج الجسم في ذلك اليوم.',points:['استشارة عافية قبل الجلسة','دمج تقنيات استرخاء واستعادة','أجواء هادئة وخصوصية','إرشادات للحفاظ على الفوائد']}}
    };
    let lang='en';
    const id=new URLSearchParams(location.search).get('id')||'1';
    const $=s=>document.querySelector(s);
    function render(){const s=services[id]||services[1], d=s[lang]; document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=`Lumière — ${d.title}`;$('#details-lang').textContent=lang==='ar'?'EN':'عربي';$('#details-book').textContent=lang==='ar'?'احجز استشارتك':'Book a Consultation';$('#service-detail').innerHTML=`<section class="detail-hero"><div class="detail-kicker">— Lumière Clinic</div><h1>${d.title}</h1><p>${d.intro}</p></section><section class="detail-body"><div><span class="detail-label">${lang==='ar'?'عن العلاج':'ABOUT THE TREATMENT'}</span><p class="detail-copy">${d.body}</p></div><div class="detail-points"><span class="detail-label">${lang==='ar'?'ما الذي يشمله':'WHAT TO EXPECT'}</span>${d.points.map((x,i)=>`<div class="detail-point"><span>0${i+1}</span><p>${x}</p></div>`).join('')}</div></section><section class="detail-cta"><h2>${lang==='ar'?'جاهزة لبدء رحلتك؟':'Ready to begin your journey?'}</h2><a href="index.html#contact" class="primary-btn">${lang==='ar'?'احجز استشارتك':'Book a Consultation'}</a></section>`}
    $('#details-lang').onclick=()=>{lang=lang==='en'?'ar':'en';render()};render();
  </script>
</body>
</html>
